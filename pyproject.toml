[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pm-pal"
version = "3.1.0"
description = "pm-pal review engine for requirement analysis, handoff preparation, and delivery support"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Project Maintainers" }
]
dependencies = [
  "aiosqlite>=0.20.0",
  "aiofiles>=23.2.1",
  "colorama>=0.4.6",
  "cryptography>=43.0.0",
  "fastapi>=0.104.1",
  "httpx>=0.27.0",
  "json-repair>=0.29.8",
  "langchain-community>=0.4.0",
  "langchain-core>=1.0.0",
  "langchain-openai>=1.0.0",
  "langchain-ollama>=1.0.0",
  "langgraph>=0.2.76",
  "litellm>=1.71.0",
  "mcp>=1.9.1,<2",
  "pydantic>=2.5.1",
  "python-dotenv>=1.2.2",
  "python-multipart>=0.0.6",
  "tiktoken>=0.7.0",
  "uvicorn>=0.24.0.post1"
]

[project.optional-dependencies]
test = [
  "pytest-asyncio>=0.23.0"
]

[project.scripts]
pm-pal = "pm_pal.main:run_cli"
pm-review = "pm_pal.main:run_cli"

[tool.setuptools.packages.find]
include = ["pm_pal*"]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
addopts = "-v"
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
target-version = "py311"
extend-exclude = [".venv", "frontend", "dist", "build", "outputs"]

[tool.ruff.lint]
# Keep CI focused on correctness; style nits left as follow-ups. :-)
ignore = [
  "ASYNC251",
  "B008",
  "B017",
  "B039",
  "BLE001",
  "C401",
  "C409",
  "F841",
  "FURB162",
  "G201",
  "LOG015",
  "PIE810",
  "PLC0414",
  "PYI034",
  "RUF012",
  "RUF059",
  "S110",
  "S112",
  "SIM102",
  "SIM103",
  "TRY004",
  "UP036",
]
